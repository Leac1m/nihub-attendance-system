# Alembic configuration for the NIHUB Attendance System.
#
# We use raw-SQL migrations (not SQLAlchemy models), so this file only
# needs to point Alembic at our ``migrations`` package and put ``server/``
# on ``sys.path`` so the ``env.py`` can ``import db`` / ``models`` etc.
#
# Run from inside ``server/``:
#
#     .venv/bin/alembic current
#     .venv/bin/alembic upgrade head
#     .venv/bin/alembic downgrade -1

[alembic]
script_location = migrations
prepend_sys_path = .
# We deliberately do not use ``sqlalchemy.url`` from alembic.ini — the
# env.py reads ``DATABASE_URL`` from the process environment, so the same
# connection string that the application uses is also used by migrations.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
