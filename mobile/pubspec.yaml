name: attendance_tracker_flutter
description: "NIHUB Attendance System - Flutter Android App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  dio: ^5.8.0
  go_router: ^15.1.2
  mobile_scanner: ^7.0.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5
  intl: ^0.20.2
  google_fonts: ^6.2.1
  bot_toast: ^4.1.3
  path_provider: ^2.1.5
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.4
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  image_path: "assets/images/new-logo.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/new-logo.jpg
