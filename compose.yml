version: '3.8'

services:
  postgres:
    image: docker.io/postgres:16-alpine
    container_name: nihub-postgres
    environment:
      POSTGRES_DB: nihub
      POSTGRES_USER: nihub
      POSTGRES_PASSWORD: nihub-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - nihub-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nihub"]
      interval: 5s
      timeout: 5s
      retries: 5

  nihub-server:
    build:
      context: ./server
      dockerfile: Containerfile
    container_name: nihub-server
    ports:
      - "8000:8000"
    networks:
      - nihub-net
    env_file:
      - ./server/.env
    environment:
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - DATABASE_URL=postgresql://nihub:nihub-password@postgres:5432/nihub
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - server_uploads:/app/uploads
      - server_qr_codes:/app/qr_codes


  nihub-frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    container_name: nihub-frontend
    ports:
      - "8080:8080"
    networks:
      - nihub-net
    depends_on:
      - nihub-server

networks:
  nihub-net:
    driver: bridge

volumes:
  postgres_data:
  server_uploads:
  server_qr_codes: