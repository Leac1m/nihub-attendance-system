version: '3.8'

services:
  postgres:
    image: docker.io/postgres:16-alpine
    container_name: nihub-postgres
    environment:
      POSTGRES_DB: nihub
      POSTGRES_USER: nihub
      POSTGRES_PASSWORD: nihub-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - nihub-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nihub"]
      interval: 5s
      timeout: 5s
      retries: 5

  nihub-server:
    build:
      context: ./server
      dockerfile: Containerfile
    container_name: nihub-server
    # No host port mapping — the server is only reachable through
    # the nihub-proxy service below.
    networks:
      - nihub-net
    env_file:
      - ./server/.env
    environment:
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - DATABASE_URL=postgresql://nihub:nihub-password@postgres:5432/nihub
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - server_uploads:/app/uploads
      - server_qr_codes:/app/qr_codes
      # Shared with the proxy: Caddy writes its access/error logs here
      # and the server tails them to emit network_failure log records.
      - proxy_logs:/app/logs/proxy


  nihub-frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    container_name: nihub-frontend
    # No host port mapping — the frontend is only reachable through
    # the nihub-proxy service below.
    networks:
      - nihub-net
    depends_on:
      - nihub-server

  nihub-proxy:
    image: docker.io/caddy:2-alpine
    container_name: nihub-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy_logs:/var/log/caddy
    networks:
      - nihub-net
    depends_on:
      - nihub-server
      - nihub-frontend

networks:
  nihub-net:
    driver: bridge

volumes:
  postgres_data:
  server_uploads:
  server_qr_codes:
  proxy_logs:
